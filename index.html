ar(--bd);padding:12px 0}details{border:1px solid var(--bd);border-radius:9px;padding:12px;margin:10px 0}summary{cursor:pointer;font-weight:700}.table{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:650px}td,th{padding:9px;border:1px solid var(--bd);text-align:left}th{background:#e7f4eb}.quizchoice{display:block;font-weight:400;background:#f8fbf9;padding:8px;border-radius:6px}.quizchoice input,.inlinecheck{width:auto;margin-right:9px}pre{white-space:pre-wrap;font:inherit}footer{text-align:center;background:var(--d);padding:18px;color:white}.small{font-size:12px}@media(max-width:850px){.layout{display:block}aside{display:flex;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;gap:5px}aside button{width:auto;white-space:nowrap;flex-shrink:0}main{padding:15px}}@media print{header,aside,footer,button{display:none!important}.layout{display:block}main{padding:0}}.upbar{position:relative}.upbar small{position:absolute;right:8px;top:-2px;font-size:11px;color:#425c50}.btn[disabled]{opacity:.6;cursor:progress}

const MODULES=[
{title:'Punto de partida: conozco mi nivel digital',icon:'🧭',goal:'Identificar conocimientos, confianza y necesidades de formación digital.',lessons:[['Competencia digital docente','La competencia digital docente integra habilidades técnicas y pedagógicas. El diagnóstico identifica fortalezas, dificultades y necesidades, sin producir una calificación.','Anote tres recursos que utiliza actualmente y una dificultad que le gustaría resolver.'],['Recursos y conectividad','Antes de preparar una clase con tecnología, reconozca equipos disponibles, almacenamiento y conectividad. Diseñe siempre una alternativa que permita continuar la actividad sin Internet.','Elabore un inventario breve de equipos y conexión disponible en su sede.'],['Confianza y autonomía','La autoformación es gradual y se fortalece con actividades pequeñas, reflexión y acompañamiento. No exige conocimientos avanzados para comenzar.','Formule una meta digital que pueda comprobar durante la próxima semana.']],steps:['Revise sus recursos disponibles','Identifique tres herramientas que conoce','Describa una dificultad concreta','Establezca una meta de aprendizaje','Registre la actividad y realice la autoevaluación'],task:'Describa sus fortalezas, dificultades, conectividad y una meta de autoformación.',quiz:[['El autodiagnóstico sirve para:',['Sancionar','Orientar el aprendizaje','Excluir docentes'],1],['Al seleccionar recursos, considere:',['Objetivo y conectividad','Popularidad','Solo el diseño'],0],['La autoformación debe favorecer:',['Autonomía acompañada','Aislamiento','Memorización'],0]]},
{title:'Herramientas digitales básicas para el trabajo docente',icon:'💻',goal:'Organizar archivos y recursos educativos para utilizar con seguridad y sin conexión.',lessons:[['Carpetas y nombres','Organice archivos por área, grado y tema. Ejemplo: Ciencias_Grado3_Agua.pdf. Los nombres claros facilitan el trabajo offline.','Cree una estructura con carpetas por área y grado.'],['Documentos y PDF','Elabore una guía editable y expórtela a PDF para conservar el formato al imprimirla. Verifique su legibilidad en un celular.','Genere una ficha breve en Word o equivalente y conviértala a PDF.'],['Seguridad y uso offline','Descargue materiales antes de la clase, compruebe que abran sin Internet y proteja los datos personales y derechos de uso.','Abra un recurso con la conexión desactivada y documente el resultado.']],steps:['Cree una carpeta de recursos','Organice subcarpetas','Elabore una guía sencilla','Guarde un documento editable y un PDF','Compruebe ambos archivos sin conexión'],task:'Organice una carpeta de recursos y entregue una descripción o documento que muestre esa organización.',quiz:[['Nombre de archivo más claro:',['Final.pdf','Ciencias_Grado3_Agua.pdf','Doc2.pdf'],1],['Para uso offline:',['Comprobar descarga','Conservar solo enlace','Exigir video en vivo'],0],['Los datos personales deben:',['Publicarse','Protegerse','Compartirse libremente'],1]]},
{title:'Recursos digitales para planear y preparar clases',icon:'📝',goal:'Crear recursos pertinentes para Escuela Nueva y aulas multigrado.',lessons:[['Del objetivo a la herramienta','Defina primero el aprendizaje esperado y luego elija el recurso digital que facilite su consecución. La herramienta es un medio.','Escriba un objetivo y justifique la elección de una TAC.'],['Fichas e infografías','Utilice textos breves, títulos claros e imágenes contextualizadas. Elabore una versión descargable o imprimible.','Esboce una ficha educativa de una página.'],['Planeación contextualizada','En aulas multigrado, adapte una misma temática con diferentes grados de complejidad y trabajo autónomo.','Adapte una ficha para dos grados.']],steps:['Seleccione un tema de clase','Defina el objetivo','Elija una herramienta TAC','Elabore una ficha o infografía','Defina evaluación y alternativa offline'],task:'Diseñe un recurso con objetivo, aplicación pedagógica y alternativa sin conexión.',quiz:[['La primera decisión es:',['Definir objetivo','Elegir colores','Descargar apps'],0],['Un recurso pertinente:',['Responde al contexto','Exige Internet','Ignora grados'],0],['Escuela Nueva favorece:',['Autonomía','Rigidez','Dependencia'],0]]},
{title:'TAC para una clase más activa',icon:'🎬',goal:'Diseñar experiencias con imágenes, audios o videos que impulsen participación.',lessons:[['Sentido pedagógico de TAC','Las tecnologías del aprendizaje y el conocimiento enriquecen una experiencia cuando se vinculan a un propósito didáctico concreto.','Explique qué aprenderían los estudiantes con un recurso audiovisual.'],['Secuencia didáctica','Diseñe momentos antes, durante y después del recurso, con preguntas orientadoras y un producto de aprendizaje.','Escriba una pregunta para cada momento.'],['Pocos dispositivos','Utilice estaciones, turnos y fichas impresas cuando los estudiantes deban compartir un equipo.','Diseñe una clase con un solo dispositivo disponible.']],steps:['Defina objetivo','Elija un recurso liviano','Prepare pregunta inicial','Oriente observación','Recoja una evidencia y prepare alternativa offline'],task:'Diseñe una experiencia TAC de veinte minutos con inicio, desarrollo, cierre y evaluación.',quiz:[['Una TAC se justifica si:',['Apoya aprendizaje','Solo entretiene','Reemplaza profesor'],0],['Secuencia recomendada:',['Antes durante después','Solo reproducción','Solo examen'],0],['Con pocos equipos:',['Rotar estaciones','Excluir','Cancelar'],0]]},
{title:'Tecnología en aulas rurales y multigrado',icon:'🌾',goal:'Adaptar recursos a diferentes grados, ritmos y conectividad limitada.',lessons:[['Un tema, varios grados','Los mismos materiales pueden producir tareas diferenciadas: identificar, comparar y analizar según el nivel del estudiante.','Proponga dos tareas para grados distintos usando la misma imagen.'],['Trabajo autónomo','Las estaciones requieren instrucciones claras, tiempo definido y productos observables.','Diseñe tres estaciones simultáneas.'],['Equivalencia offline','Una actividad sin Internet debe mantener el mismo objetivo, mediante guías, audios descargados o recursos impresos.','Transforme una actividad en línea en una alternativa offline.']],steps:['Seleccione tema territorial','Defina grados','Redacte objetivos diferenciados','Elija recurso compartido','Prepare actividad autónoma e imprimible'],task:'Adapte una actividad para dos o más grados, incluyendo tareas diferenciadas y alternativa offline.',quiz:[['En multigrado conviene:',['Diferenciar','Uniformar','Eliminar autonomía'],0],['Alternativa offline:',['Conserva objetivo','Cambia tema','Requiere videollamada'],0],['Las estaciones permiten:',['Autonomía','Exclusión','Más datos'],0]]},
{title:'Evaluar y acompañar con herramientas digitales',icon:'📊',goal:'Diseñar instrumentos de evaluación y retroalimentación accesibles.',lessons:[['Evidencias','Las evidencias de aprendizaje pueden ser documentos, fotografías de productos y registros escritos. Evite exponer datos personales.','Defina dos evidencias observables para una actividad.'],['Rúbricas y listas','La lista de chequeo verifica criterios; la rúbrica describe niveles de desempeño. Ambas orientan la mejora.','Escriba tres criterios para valorar un recurso.'],['Retroalimentación breve','La retroalimentación señala un logro y una recomendación concreta mediante texto o audio breve.','Redacte un comentario de retroalimentación constructiva.']],steps:['Seleccione actividad','Determine logros esperados','Construya rúbrica o lista','Escoja evidencias','Redacte orientación de mejora'],task:'Elabore una rúbrica o lista de chequeo para una experiencia mediada por TAC.',quiz:[['La evidencia permite:',['Observar aprendizaje','Eliminar objetivos','Evitar evaluación'],0],['La retroalimentación útil:',['Señala logros y mejoras','Solo nota','No orienta'],0],['El registro exige:',['Privacidad','Difusión libre','Compartir claves'],0]]}
];
const MATERIALS=[['Guía de navegación',`RURALTECH — GUÍA DE NAVEGACIÓN\n1. Inicie sesión con su cuenta docente.\n2. Complete el diagnóstico inicial.\n3. Explore módulos del 0 al 5.\n4. Revise tres microlecciones por módulo.\n5. Desarrolle la actividad en texto o adjunte archivo.\n6. Responda cuestionario y autoevalúe.\n7. Consulte progreso y productos.\n8. Descargue recursos para trabajar sin conexión.`],['Plantilla de planeación TAC',`DOCENTE:\nSEDE:\nGRADOS:\nTEMA:\nOBJETIVO:\nNECESIDAD PEDAGÓGICA:\nHERRAMIENTA TAC Y JUSTIFICACIÓN:\nINICIO:\nDESARROLLO:\nCIERRE:\nEVIDENCIA:\nCRITERIOS DE EVALUACIÓN:\nALTERNATIVA OFFLINE:\nREFLEXIÓN:`],['Adaptación multigrado',`TEMA COMÚN:\nRECURSO DIGITAL:\nGRADO INICIAL - OBJETIVO Y ACTIVIDAD:\nGRADO INTERMEDIO - OBJETIVO Y ACTIVIDAD:\nGRADO AVANZADO - OBJETIVO Y ACTIVIDAD:\nTRABAJO AUTÓNOMO:\nMATERIAL IMPRESO:\nALTERNATIVA SIN CONEXIÓN:\nEVALUACIÓN DIFERENCIADA:`],['Lista de chequeo TAC',`[ ] Recurso relacionado con objetivo\n[ ] Contextualizado a la ruralidad\n[ ] Instrucciones comprensibles\n[ ] Adaptado a los grados\n[ ] Bajo consumo de datos\n[ ] Alternativa offline\n[ ] Actividad participativa\n[ ] Evidencia observable\n[ ] Respeta privacidad\n[ ] Fuentes revisadas`],['Rúbrica del producto final',`Puntúe de 1 a 3:\nPERTINENCIA: 3 objetivo claro; 2 parcial; 1 sin relación.\nCONTEXTO: 3 adaptado a ruralidad; 2 parcialmente; 1 no considera entorno.\nTAC: 3 integrada didácticamente; 2 parcial; 1 decorativa.\nACCESIBILIDAD: 3 alternativa offline viable; 2 parcial; 1 ninguna.\nEVALUACIÓN: 3 evidencias y criterios; 2 incompletos; 1 ausentes.\nTOTAL: /15\nFORTALEZAS:\nMEJORAS:`],['Ficha de autodiagnóstico',`HERRAMIENTAS QUE CONOZCO:\nFRECUENCIA DE USO:\nCONFIANZA DIGITAL:\nDISPOSITIVOS DISPONIBLES:\nCONDICIONES DE CONEXIÓN:\nFORTALEZAS:\nDIFICULTADES:\nMETA PERSONAL:\nAPOYO QUE NECESITO:`],['Guion audiovisual TAC',`TEMA:\nOBJETIVO:\nRECURSO (IMAGEN, AUDIO O VIDEO):\nANTES: pregunta de apertura\nDURANTE: consignas de observación\nDESPUÉS: producto observable\nEVALUACIÓN:\nALTERNATIVA SIN CONEXIÓN:`],['Organizador de archivos',`CARPETA: Recursos_Docentes\n01_Planeaciones\n02_Guias\n03_Presentaciones\n04_Imagenes\n05_Evaluaciones\n06_Evidencias\n07_Respaldos\nNOMBRES RECOMENDADOS: Asignatura_Grado_Tema.ext\nCOMPROBAR APERTURA SIN INTERNET Y PROTECCIÓN DE DATOS.`]];
let session={user:null,csrf:''},overview=null,current=0;
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(action,body=null,upload=false){
  const send=async()=>{
    const options={credentials:'same-origin',headers:{'X-CSRF-Token':session.csrf}};
    if(body!==null){
      options.method='POST';
      if(upload)options.body=body;
      else{options.headers['Content-Type']='application/json';options.body=JSON.stringify(body)}
    }
    const response=await fetch('api.php?action='+encodeURIComponent(action),options);
    const data=await response.json().catch(()=>({error:'Respuesta inesperada del servidor'}));
    if(data&&typeof data==='object'&&data.csrf)session.csrf=data.csrf;
    return{response,data};
  };
  let{response,data}=await send();
  if(response.status===403&&body!==null&&data?.error==='Token de protección no válido'){
    const sync=await fetch('api.php?action=session',{credentials:'same-origin',cache:'no-store'});
    const fresh=await sync.json().catch(()=>({error:'No se pudo renovar el token de protección'}));
    if(!sync.ok||!fresh?.csrf)throw Error(fresh?.error||'No se pudo renovar el token de protección');
    session=fresh;
    ({response,data}=await send());
  }
  if(!response.ok){if(response.status===401){session={user:null,csrf:''};nav()}throw Error(data.error||'Error HTTP '+response.status)}
  return data;
}
function show(html){$('app').innerHTML=html;window.scrollTo(0,0)}function progress(x){return `<div class="progress"><span style="width:${Math.min(100,Math.max(0,x))}%"></span></div>`}function msg(e){alert(e.message||String(e))}
function downloadText(name,text){let url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function busy(el,txt){if(!el)return;el.dataset.t=el.textContent;el.disabled=true;el.textContent=txt||'Procesando…'}function unbusy(el){if(!el)return;el.disabled=false;el.textContent=el.dataset.t??el.textContent}
function fmtDate(x){try{if(!x)return'';return new Date(x).toLocaleString('es-CO',{dateStyle:'medium',timeStyle:'short'})}catch(_){return String(x||'')}}
function barHTML(id){return `<div class="progress upbar" id="${id}" style="display:none"><span style="width:0%"></span><small>0%</small></div>`}
function setBar(id,p,txt){const b=$(id);if(!b)return;b.style.display='block';b.querySelector('span').style.width=Math.min(100,Math.max(2,p))+'%';b.querySelector('small').textContent=txt??(p+'%')}
function hideBar(id){const b=$(id);if(b){b.style.display='none'}}
async function uploadXHR(prep,file,onp){return new Promise((resolve,reject)=>{let xhr=new XMLHttpRequest();xhr.open('PUT',prep.uploadUrl);xhr.setRequestHeader('authorization','Bearer '+prep.token);xhr.setRequestHeader('x-vercel-blob-access','private');xhr.setRequestHeader('x-content-type',prep.contentType);xhr.setRequestHeader('x-vercel-blob-store-id',prep.storeId);xhr.setRequestHeader('x-api-version','13');xhr.setRequestHeader('x-api-blob-request-id',prep.fid+':'+Date.now()+':x1');xhr.setRequestHeader('x-api-blob-request-attempt','0');xhr.upload.onprogress=e=>{if(e.lengthComputable&&onp)onp(Math.round(e.loaded/e.total*100))};xhr.onload=()=>{if(xhr.status>=200&&xhr.status<300)return resolve();let m='Error al subir el archivo';try{let j=JSON.parse(xhr.responseText);m=(j.error&&j.error.message)||m}catch(_){/*sin cuerpo*/}reject(Error(m))};xhr.onerror=()=>reject(Error('Fallo de red durante la subida'));xhr.send(file)})}
async function uploadFile(file,meta,barId){if(!file)throw Error('Seleccione un archivo');const video=meta.kind==='resource'&&/\.(mp4|webm)$/i.test(file.name),max=video?104857600:15728640;if(file.size>max)throw Error(video?'Máximo 100 MB por video':'Máximo 15 MB por archivo');if(file.size<1)throw Error('El archivo está vacío');const prep=await api('upload_prepare',Object.assign({name:file.name,size:file.size},meta));setBar(barId,4,'Subiendo…');await uploadXHR(prep,file,p=>setBar(barId,Math.max(4,Math.round(p*.9)),'Subiendo… '+Math.round(p*.9)+'%'));setBar(barId,96,'Registrando…');const out=await api('upload_complete',Object.assign({fid:prep.fid,name:file.name,size:file.size},meta));hideBar(barId);return out}
function guide(i){let m=MODULES[i];return `RURALTECH - GUÍA DIDÁCTICA\nMÓDULO ${i}: ${m.title}\nOBJETIVO: ${m.goal}\nPASOS:\n${m.steps.map((s,n)=>(n+1)+'. '+s).join('\n')}\nACTIVIDAD: ${m.task}\nFINALIZACIÓN: 3 lecciones, 1 actividad, 2/3 respuestas correctas y autoevaluación.`}
async function refresh(){session=await api('session');if(session.user)overview=await api('overview');else overview=null;nav()}
function nav(){let role=session.user?.role;let es={admin:'Administrador',teacher:'Docente'}[role]||'';$('identity').textContent=session.user?session.user.name+' · '+es:'Sin sesión';$('nav').innerHTML=(session.user?[['home','🏠 Inicio'],['route','📚 Mi ruta'],['diagnosis','🧭 Diagnóstico'],['resources','📥 Recursos'],['evidence','📁 Evidencias'],['progress','📊 Progreso'],['community','🤝 Comunidad'],['final','🎓 Producto final'],['evaluation','🔬 Valoración'],...(role==='admin'?[['admin','🛡️ Administración'],['auditPage','📜 Auditoría']]:[]),['account','🔑 Contraseña'],['logout','🚪 Salir']]:[['login','🔐 Ingresar']]).map(([p,n])=>`<button onclick="go('${p}')">${n}</button>`).join('')}
async function go(page){try{if(page==='logout'){await api('logout',{});await refresh();page='login'}if(page==='login')return login();if(!session.user)return login();if(['home','route','progress','evidence','final','diagnosis','admin'].includes(page))overview=await api('overview');({home,route,diagnosis,resources,evidence,progress:progressPage,community,final:finalPage,evaluation,admin,account,auditPage})[page]?.()}catch(e){msg(e)}}
function login(){show(`<div class="panel" style="max-width:470px;margin:30px auto"><h1>Acceso a RuralTech</h1><p>Introduzca la cuenta creada por la administración.</p><form id="loginForm"><label for="email">Correo</label><input type="email" id="email" autocomplete="username" required><label for="password">Contraseña</label><input type="password" id="password" autocomplete="current-password" required><button class="btn" id="loginBtn">Ingresar</button></form><p class="muted small">El administrador crea las cuentas de docentes desde su panel.</p></div>`);$('loginForm').onsubmit=async e=>{e.preventDefault();busy($('loginBtn'),'Ingresando…');try{session=await api('login',{email:$('email').value.trim(),password:$('password').value});await refresh();home()}catch(err){msg(err)}finally{unbusy($('loginBtn'))}}}
function home(){let p=overview.progress;show(`<div class="hero"><h1>Aprendizaje rural con tecnología</h1><p>RuralTech fortalece las competencias digitales para apropiarse pedagógicamente de las TAC, con actividades contextualizadas, autonomía y acompañamiento.</p><button class="btn sec" onclick="go('route')">Comenzar formación</button></div><div class="grid"><div class="card"><h2>🧭 Mi ruta</h2><p>Seis módulos y 18 microlecciones.</p><button class="btn" onclick="go('route')">Explorar</button></div><div class="card"><h2>📥 Recursos</h2><p>Material didáctico y guías descargables.</p><button class="btn" onclick="go('resources')">Consultar</button></div><div class="card"><h2>📊 Avance</h2><h1>${p.percent}%</h1>${progress(p.percent)}<p>${p.completed}/6 módulos completados.</p></div></div>`)}
function route(){show(`<h1>Mi ruta de aprendizaje</h1><p>Explore cada módulo a su propio ritmo.</p><div class="grid">${MODULES.map((m,i)=>`<div class="card"><h2>${m.icon} Módulo ${i}</h2><h3>${esc(m.title)}</h3><p>${esc(m.goal)}</p>${progress(overview.progress.modules[i].percent)}<strong>${overview.progress.modules[i].percent}%</strong><div><button class="btn" onclick="openModule(${i})">Ingresar</button></div></div>`).join('')}</div>`)}
async function openModule(i){current=i;overview=await api('overview');let m=MODULES[i],d=overview.modules?.[i]||{},p=overview.progress.modules[i],attached=overview.submissions.filter(s=>s.module===i);show(`<button class="btn sec" onclick="go('route')">← Mi ruta</button><h1>${m.icon} Módulo ${i}: ${esc(m.title)}</h1><div class="panel"><strong>${esc(m.goal)}</strong>${progress(p.percent)}${p.percent}% · ${p.milestones}/6 indicadores</div><div class="panel"><h2>1. Antes de empezar</h2><p>Relacione el tema con una situación real de su práctica pedagógica.</p></div><div class="panel"><h2>2. Aprende</h2>${m.lessons.map((l,n)=>`<details><summary>Microlección ${n+1}: ${esc(l[0])}</summary><p>${esc(l[1])}</p><p><strong>Práctica:</strong> ${esc(l[2])}</p></details><label><input class="inlinecheck" type="checkbox" ${d.read?.includes(n)?'checked':''} onchange="saveLesson(${i},${n},this.checked)">He revisado esta lección</label>`).join('')}</div><div class="panel"><h2>3. Mira un ejemplo</h2><p>${esc(m.lessons[1][2])}</p></div><div class="panel"><h2>4. Hazlo tú</h2><p>${esc(m.task)}</p><button class="btn sec" onclick="downloadText('RuralTech_Guia_Modulo_${i}.txt',guide(${i}))">Descargar guía paso a paso</button><button class="btn sec" onclick="viewGuide(${i})">Leer guía</button><label>Respuesta escrita</label><textarea id="activity">${esc(d.activity||'')}</textarea><button class="btn" onclick="saveActivity(${i},this)">Guardar respuesta</button><label for="file">Adjuntar Word, PDF, imágenes u otros formatos</label><input type="file" id="file" accept=".pdf,.doc,.docx,.odt,.jpg,.jpeg,.png,.webp,.txt,.rtf,.ppt,.pptx,.xls,.xlsx"><button class="btn" onclick="uploadEvidence(${i},this)">Entregar archivo</button>${barHTML('upM')}<p class="muted small">Máximo 15 MB por archivo.</p>${attached.map(s=>s.files.map(f=>`<div class="row">${esc(f.name)} <button class="btn sec" onclick="fileDownload('${f.id}')">Descargar</button></div>`).join('')).join('')}</div><div class="panel"><h2>5. Llévalo al aula</h2><p>Adapte su producto a los grados, condiciones de conectividad y recursos disponibles.</p></div><div class="panel"><h2>6. Guarda el recurso</h2><button class="btn sec" onclick="downloadText('RuralTech_Guia_Modulo_${i}.txt',guide(${i}))">Guardar guía</button><button class="btn sec" onclick="go('resources')">Banco de recursos</button></div><div class="panel"><h2>7. ¿Cómo me fue?</h2><label><input class="inlinecheck" type="checkbox" ${d.reflection?'checked':''} onchange="saveReflection(${i},this.checked)">He reflexionado sobre la aplicación de lo aprendido.</label></div><div class="panel"><h2>Cuestionario</h2>${m.quiz.map((q,n)=>`<div class="card"><strong>${n+1}. ${esc(q[0])}</strong>${q[1].map((v,j)=>`<label class="quizchoice"><input class="inlinecheck" type="radio" name="q${n}" value="${j}">${esc(v)}</label>`).join('')}</div>`).join('')}<button class="btn" onclick="submitQuiz(${i})">Calificar</button><div id="quizFeedback">Mejor resultado: ${d.score??'Pendiente'}/3</div></div>`)}
function viewGuide(i){show(`<button class="btn sec" onclick="openModule(${i})">← Volver</button><div class="panel"><h1>Guía didáctica módulo ${i}</h1><pre>${esc(guide(i))}</pre><button class="btn" onclick="downloadText('Guia_Modulo_${i}.txt',guide(${i}))">Descargar</button><button class="btn sec" onclick="window.print()">Imprimir / PDF</button></div>`)}
async function saveLesson(i,n,checked){try{await api('save_module',{module:i,type:'read',lesson:n,checked})}catch(e){msg(e)}}async function saveReflection(i,checked){try{await api('save_module',{module:i,type:'reflection',checked})}catch(e){msg(e)}}async function saveActivity(i,btn){busy(btn,'Guardando…');try{await api('save_module',{module:i,type:'activity',text:$('activity').value});alert('Actividad guardada');await openModule(i)}catch(e){msg(e)}finally{unbusy(btn)}}
async function submitQuiz(i){try{let answers=MODULES[i].quiz.map((q,n)=>{let c=document.querySelector(`input[name=q${n}]:checked`);if(!c)throw Error('Responda todas las preguntas');return +c.value});await api('save_module',{module:i,type:'quiz',answers});let score=answers.reduce((s,a,n)=>s+(a===MODULES[i].quiz[n][2]),0);$('quizFeedback').innerHTML=`<div class="success"><h3>Resultado: ${score}/3</h3>${MODULES[i].quiz.map((q,n)=>`<p>Pregunta ${n+1}: ${esc(q[1][q[2]])}</p>`).join('')}</div>`}catch(e){msg(e)}}
async function uploadEvidence(i,btn){busy(btn,'Subiendo…');try{let f=$('file').files[0];await uploadFile(f,{kind:'submission',module:i},'upM');alert('Evidencia entregada');await openModule(i)}catch(e){msg(e)}finally{unbusy(btn);hideBar('upM')}}
function fileDownload(id){window.location.assign('api.php?action=download&id='+encodeURIComponent(id))}
function diagnosis(){let d=overview.modules?.diagnosis||{};show(`<h1>Autodiagnóstico orientador</h1><div class="notice">No es una calificación. Reflexione sobre confianza, conectividad, equipos y necesidades.</div><div class="panel"><label for="diagnosisText">Descripción de recursos y habilidades</label><textarea id="diagnosisText" placeholder="Equipos, conectividad, habilidades y meta personal">${esc(d.activity||'')}</textarea><button class="btn" onclick="saveDiagnosis(this)">Guardar reflexión inicial</button></div>`)}async function saveDiagnosis(btn){busy(btn,'Guardando…');try{await api('save_module',{type:'diagnosis',text:$('diagnosisText').value});alert('Reflexión inicial guardada');overview=await api('overview')}catch(e){msg(e)}finally{unbusy(btn)}}
async function resources(){try{let rs=await api('resource_list');show(`<h1>Banco de materiales didácticos</h1><div class="grid">${MATERIALS.map((r,i)=>`<div class="card"><h3>${esc(r[0])}</h3><button class="btn" onclick="downloadText('RuralTech_Material_${i+1}.txt',MATERIALS[${i}][1])">Descargar</button><button class="btn sec" onclick="viewMaterial(${i})">Leer</button></div>`).join('')}</div><h2>Guías por módulo</h2>${MODULES.map((m,i)=>`<div class="row">Módulo ${i}: ${esc(m.title)} <button class="btn sec" onclick="downloadText('Guia_Modulo_${i}.txt',guide(${i}))">Descargar</button></div>`).join('')}<h2>Recursos de administración</h2>${rs.map(r=>`<div class="card"><h3>${esc(r.title)}</h3><p>${esc(r.description)}</p><button class="btn" onclick="fileDownload('${r.file.id}')">Descargar ${esc(r.file.name)}</button></div>`).join('')||'<p>No hay recursos adicionales.</p>'}`)}catch(e){msg(e)}}
function viewMaterial(i){show(`<button class="btn sec" onclick="go('resources')">← Volver</button><div class="panel"><h1>${esc(MATERIALS[i][0])}</h1><pre>${esc(MATERIALS[i][1])}</pre><button class="btn" onclick="downloadText('Material_${i+1}.txt',MATERIALS[${i}][1])">Descargar</button><button class="btn sec" onclick="window.print()">Imprimir / PDF</button></div>`)}
function evidence(){let ss=overview.submissions;show(`<h1>Mis evidencias</h1>${MODULES.map((m,i)=>`<div class="panel"><h3>Módulo ${i}: ${esc(m.title)}</h3>${ss.filter(s=>s.module===i).map(s=>s.files.map(f=>`<div class="row">${esc(f.name)} <button class="btn sec" onclick="fileDownload('${f.id}')">Descargar</button></div>`).join('')).join('')||'<p>Sin archivos adjuntos</p>'}</div>`).join('')}`)}
function progressPage(){let p=overview.progress;show(`<h1>Seguimiento de mi aprendizaje</h1><div class="grid"><div class="card"><h2>${p.percent}%</h2>Avance general${progress(p.percent)}</div><div class="card"><h2>${p.completed}/6</h2>Módulos completos</div><div class="card"><h2>${p.milestones}/36</h2>Indicadores alcanzados</div></div>${p.modules.map((m,i)=>`<div class="panel"><h3>Módulo ${i}: ${esc(MODULES[i].title)}</h3>${progress(m.percent)}${m.percent}% · ${m.read}/3 lecciones · Actividad: ${m.activity?'Sí':'No'} · Cuestionario: ${m.score??'-'}/3 · Reflexión: ${m.reflection?'Sí':'No'}</div>`).join('')}<button class="btn" onclick="csvOwn()">Exportar CSV</button>`)}
function csvRows(name,rows){let csv='\uFEFF'+rows.map(row=>row.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');downloadText(name,csv)}function csvOwn(){csvRows('RuralTech_mi_progreso.csv',[['Modulo','Progreso','Lecciones','Actividad','Nota','Reflexion'],...overview.progress.modules.map(m=>[m.module,m.percent,m.read,m.activity,m.score,m.reflection])])}
async function finalPage(){show(`<h1>Producto final de aplicación pedagógica</h1><div class="panel"><p>Presente una planeación, guía o actividad TAC contextualizada a la ruralidad. Puede usar la rúbrica disponible en Recursos.</p><label for="finalFile">Documento de evidencia final</label><input type="file" id="finalFile" accept=".pdf,.doc,.docx,.odt,.jpg,.jpeg,.png,.webp,.txt,.rtf,.ppt,.pptx,.xls,.xlsx"><button class="btn" onclick="uploadFinal(this)">Entregar producto final</button>${barHTML('upF')}<h3>Archivos entregados</h3>${overview.submissions.filter(s=>s.module===6).map(s=>s.files.map(f=>`<div class="row">${esc(f.name)} <button class="btn sec" onclick="fileDownload('${f.id}')">Descargar</button></div>`).join('')).join('')||'<p>No hay producto final.</p>'}</div>`)}async function uploadFinal(btn){busy(btn,'Subiendo…');try{let f=$('finalFile').files[0];await uploadFile(f,{kind:'submission',module:6},'upF');alert('Producto entregado');await go('final')}catch(e){msg(e)}finally{unbusy(btn);hideBar('upF')}}
const CRITERIA=['Facilidad de navegación','Claridad de contenidos','Pertinencia pedagógica','Contextualización rural','Accesibilidad','Viabilidad con baja conectividad','Aplicación multigrado','Utilidad de actividades','Retroalimentación','Satisfacción general'];async function evaluation(){try{let v=await api('evaluation');show(`<h1>Valoración de RuralTech</h1><p>Escala del 1 al 5. Esta valoración no reemplaza la validación con expertos.</p><div class="panel">${CRITERIA.map((c,i)=>`<label>${esc(c)}</label><select id="eval${i}"><option value="">Seleccionar</option>${[1,2,3,4,5].map(n=>`<option value="${n}" ${(v.ratings?.[i]===n)?'selected':''}>${n}</option>`).join('')}</select>`).join('')}<label>Recomendaciones y dificultades</label><textarea id="comments">${esc(v.comments||'')}</textarea><button class="btn" onclick="saveEvaluation()">Guardar valoración</button></div>`)}catch(e){msg(e)}}async function saveEvaluation(){try{let ratings=CRITERIA.map((_,i)=>+$('eval'+i).value);if(ratings.some(n=>n<1||n>5))throw Error('Complete las diez valoraciones');await api('evaluation_save',{ratings,comments:$('comments').value});alert('Valoración guardada')}catch(e){msg(e)}}
async function community(){try{let posts=await api('community');show(`<h1>Comunidad RuralTech</h1><p>Las publicaciones se comparten entre las cuentas de RuralTech conectadas al mismo servidor.</p><div class="panel"><label for="post">Pregunta o experiencia</label><textarea id="post"></textarea><button class="btn" onclick="postCommunity(this)">Publicar</button></div>${posts.slice().reverse().map(p=>`<div class="card"><strong>${esc(p.author)}</strong><p class="muted small">${esc(fmtDate(p.created))}</p><p>${esc(p.text)}</p></div>`).join('')||'<div class="panel"><p class="muted">Aún no hay publicaciones. Sea la primera persona en compartir una experiencia.</p></div>'}`)}catch(e){msg(e)}}async function postCommunity(btn){busy(btn,'Publicando…');try{await api('community_post',{text:$('post').value});community()}catch(e){msg(e)}finally{unbusy(btn)}}
async function account(){show(`<h1>Seguridad de cuenta</h1><div class="panel"><label for="old">Contraseña actual</label><input id="old" type="password" autocomplete="current-password"><label for="new">Nueva contraseña (mínimo 12 caracteres)</label><input id="new" type="password" autocomplete="new-password"><label for="new2">Repetir nueva contraseña</label><input id="new2" type="password" autocomplete="new-password"><button class="btn" onclick="changePassword(this)">Actualizar contraseña</button></div>`)}async function changePassword(btn){busy(btn,'Actualizando…');try{if($('new').value!==$('new2').value)throw Error('Las contraseñas nuevas no coinciden');await api('change_password',{old:$('old').value,password:$('new').value});alert('Contraseña actualizada');go('home')}catch(e){msg(e)}finally{unbusy(btn)}}
const ROLE_ES={admin:'Administrador',teacher:'Docente'};
async function admin(){if(session.user?.role!=='admin')return show('<h1>Acceso no autorizado</h1>');try{let [users,resources,evals]=await Promise.all([api('users'),api('resource_list'),api('evaluations')]);let avg=users.length?Math.round(users.reduce((s,u)=>s+u.progress.percent,0)/users.length):0;window.adminUsers=users;window.adminEvals=evals;show(`<h1>🛡️ Panel de administración</h1><div class="grid"><div class="card"><h2>${users.length}</h2>Usuarios</div><div class="card"><h2>${avg}%</h2>Avance promedio</div><div class="card"><h2>${users.reduce((s,u)=>s+u.progress.completed,0)}</h2>Módulos completados</div></div><div class="panel"><h2>Seguimiento por usuario</h2><label for="adminFilter">Buscar</label><input id="adminFilter" placeholder="Nombre, sede o correo" oninput="adminFilter(this.value)"><div class="table"><table><tr><th>Nombre</th><th>Sede</th><th>Rol</th><th>Avance</th><th>Módulos</th><th>Acción</th></tr>${users.map(u=>`<tr class="urow" data-search="${esc((u.name+' '+u.site+' '+u.email).toLowerCase())}"><td>${esc(u.name)}</td><td>${esc(u.site)}</td><td>${esc(ROLE_ES[u.role]||u.role)}</td><td>${u.progress.percent}%</td><td>${u.progress.completed}/6</td><td><button class="btn sec" onclick="adminDetail('${u.id}')">Detalles</button></td></tr>`).join('')}</table></div><button class="btn" onclick="adminExport()">Exportar seguimiento CSV</button></div><div class="panel"><h2>Crear usuario (docente o administrador)</h2><label for="userName">Nombre</label><input id="userName"><label for="userEmail">Correo</label><input id="userEmail" type="email"><label for="userSite">Sede</label><input id="userSite"><label for="userRole">Rol</label><select id="userRole"><option value="teacher">Docente</option><option value="admin">Administrador</option></select><label for="userPassword">Contraseña inicial (12+ caracteres)</label><input id="userPassword" type="password"><label for="userPassword2">Repetir contraseña</label><input id="userPassword2" type="password"><button class="btn" onclick="adminCreateUser(this)">Crear usuario</button></div><div class="panel"><h2>Subir recurso institucional</h2><label for="resourceTitle">Título</label><input id="resourceTitle"><label for="resourceDescription">Descripción</label><textarea id="resourceDescription"></textarea><label for="resourceModule">Módulo</label><select id="resourceModule"><option value="all">Banco general</option>${MODULES.map((_,i)=>`<option value="${i}">Módulo ${i}</option>`).join('')}</select><label for="resourceFile">Archivo (máximo 15 MB)</label><input type="file" id="resourceFile" accept=".pdf,.doc,.docx,.odt,.jpg,.jpeg,.png,.webp,.txt,.rtf,.ppt,.pptx,.xls,.xlsx"><button class="btn" onclick="adminUpload(this)">Cargar recurso</button>${barHTML('upR')}${resources.map(r=>`<div class="row"><span>${esc(r.title)}</span><button class="btn sec" onclick="fileDownload('${r.file.id}')">Descargar</button><button class="btn danger" onclick="adminDeleteResource('${r.id}')">Eliminar</button></div>`).join('')}</div><div class="panel"><h2>Valoraciones recibidas</h2>${evals.map(e=>`<details><summary>${esc(e.name)} · promedio ${(e.ratings.reduce((a,b)=>a+b,0)/e.ratings.length).toFixed(1)}/5</summary><p class="muted small">${esc(fmtDate(e.updated))} · ${esc(ROLE_ES[e.role]||e.role)}</p><p>${e.ratings.map(r=>'★'.repeat(r)+'☆'.repeat(5-r)).join(' · ')}</p><p>${esc(e.comments||'Sin comentarios')}</p></details>`).join('')||'<p class="muted">Aún no hay valoraciones.</p>'}</div><div class="panel"><h2>Respaldo completo</h2><p>Descarga datos, progreso y TODOS los archivos adjuntos en un TAR.</p><button class="btn" onclick="window.open('api.php?action=backup','_blank')">Descargar respaldo integral</button><h2>Restaurar respaldo</h2><p class="notice">Reemplaza todos los datos y archivos actuales por los del respaldo seleccionado. Se guarda automáticamente una copia previa. Máximo 4 MB y 20 archivos adjuntos.</p><label for="restoreFile">Archivo de respaldo (.tar)</label><input type="file" id="restoreFile" accept=".tar"><button class="btn danger" onclick="adminRestore(this)">Restaurar respaldo</button></div>`)}catch(e){msg(e)}}
function adminFilter(q){q=(q||'').toLowerCase();document.querySelectorAll('.urow').forEach(tr=>tr.style.display=tr.dataset.search.includes(q)?'':'none')}
async function adminRestore(btn){if(!confirm('¿Restaurar el respaldo? Se reemplazarán TODOS los datos actuales.'))return;busy(btn,'Restaurando…');try{let f=$('restoreFile').files[0];if(!f)throw Error('Seleccione el archivo .tar del respaldo');if(f.size>4194304)throw Error('El respaldo supera 4 MB (límite de la plataforma)');let fd=new FormData();fd.append('tar',f);await api('restore',fd,true);alert('Restauración completada. Se guardó una copia previa en el almacén.');admin()}catch(e){msg(e)}finally{unbusy(btn)}}
async function adminCreateUser(btn){busy(btn,'Creando…');try{if($('userPassword').value!==$('userPassword2').value)throw Error('Las contraseñas no coinciden');await api('create_user',{name:$('userName').value,email:$('userEmail').value,site:$('userSite').value,role:$('userRole').value,password:$('userPassword').value});alert('Usuario creado');admin()}catch(e){msg(e)}finally{unbusy(btn)}}async function adminUpload(btn){busy(btn,'Subiendo…');try{let f=$('resourceFile').files[0];await uploadFile(f,{kind:'resource',title:$('resourceTitle').value,description:$('resourceDescription').value,module:$('resourceModule').value},'upR');alert('Recurso publicado');admin()}catch(e){msg(e)}finally{unbusy(btn);hideBar('upR')}}async function adminDeleteResource(id){if(!confirm('¿Eliminar recurso?'))return;try{await api('resource_delete',{id});admin()}catch(e){msg(e)}}
function adminExport(){let rows=[['Docente','Sede','Rol','Modulo','Progreso','Actividad','Nota','Lecciones','Completado']];for(let u of window.adminUsers||[])for(let m of u.progress.modules)rows.push([u.name,u.site,u.role,m.module,m.percent,m.activity,m.score,m.read,m.done]);csvRows('RuralTech_seguimiento.csv',rows)}
async function adminDetail(id){try{let response=await fetch('api.php?action=overview&user='+encodeURIComponent(id),{credentials:'same-origin'});let data=await response.json();if(!response.ok)throw Error(data.error||'Error al consultar');let u=data.user;show(`<button class="btn sec" onclick="admin()">← Administración</button><h1>${esc(u.name)}</h1><p>${esc(u.site)} · ${esc(u.email)} · ${esc(ROLE_ES[u.role]||u.role)}</p><h2>Avance ${data.progress.percent}%</h2>${progress(data.progress.percent)}${MODULES.map((m,i)=>{let d=data.modules?.[i]||{},p=data.progress.modules[i];return `<div class="panel"><h3>Módulo ${i}: ${esc(m.title)}</h3>${progress(p.percent)}${p.percent}% · Lecciones ${p.read}/3 · Nota ${p.score??'Pendiente'}/3 · Intentos ${p.attempts}<p><strong>Actividad:</strong></p><pre>${esc(d.activity||'No entregada en texto')}</pre>${data.submissions.filter(s=>s.module===i).map(s=>s.files.map(f=>`<div class="row">${esc(f.name)} <button class="btn sec" onclick="fileDownload('${f.id}')">Descargar</button></div>`).join('')).join('')}</div>`}).join('')}<div class="panel"><h2>Producto final</h2>${data.submissions.filter(s=>s.module===6).map(s=>s.files.map(f=>`<div class="row">${esc(f.name)} <button class="btn sec" onclick="fileDownload('${f.id}')">Descargar</button></div>`).join('')).join('')||'No entregado'}</div><div class="panel"><h2>Autodiagnóstico inicial</h2><pre>${esc(data.modules?.diagnosis?.activity||'Sin diagnóstico registrado')}</pre></div><div class="panel"><h2>Valoración de RuralTech</h2>${data.evaluation?`<p>Promedio ${(data.evaluation.ratings.reduce((a,b)=>a+b,0)/data.evaluation.ratings.length).toFixed(1)}/5 · ${esc(fmtDate(data.evaluation.updated))}</p><p>${esc(data.evaluation.comments||'Sin comentarios')}</p>`:'Sin valoración enviada'}</div><div class="panel"><h2>Restablecer contraseña</h2><label for="resetPwd">Nueva contraseña</label><input id="resetPwd" type="password" placeholder="Nueva contraseña (12+ caracteres)"><button class="btn" onclick="resetPwd('${id}')">Guardar nueva contraseña</button></div>`)}catch(e){msg(e)}}async function resetPwd(id){try{await api('reset_password',{user_id:id,password:$('resetPwd').value});alert('Contraseña restablecida')}catch(e){msg(e)}}
async function auditPage(){if(session.user?.role!=='admin')return show('<h1>Acceso no autorizado</h1>');try{let [log,users]=await Promise.all([api('audit'),api('users')]);let names={};users.forEach(u=>names[u.id]=u.name+' ('+(ROLE_ES[u.role]||u.role)+')');show(`<h1>📜 Registro de auditoría</h1><p class="muted">Últimos 100 eventos registrados por el servidor.</p><div class="panel"><div class="table"><table><tr><th>Fecha</th><th>Evento</th><th>Actor</th><th>Detalle</th></tr>${log.slice().reverse().map(r=>`<tr><td>${esc(fmtDate(r.time))}</td><td>${esc(r.action)}</td><td>${esc(names[r.actor]||r.actor)}</td><td class="small">${esc(r.detail||'')}</td></tr>`).join('')||'<tr><td colspan="4">Sin eventos todavía.</td></tr>'}</table></div></div>`)}catch(e){msg(e)}}
(async()=>{try{await refresh();go(session.user?'home':'login')}catch(e){show(`<div class="notice">No se pudo conectar al servidor RuralTech. Debe instalar el proyecto con PHP y abrir la dirección del servidor, no abrir index.html como archivo local.</div>`);msg(e)}})();
</script><script src="features.js"></script></body></html>
